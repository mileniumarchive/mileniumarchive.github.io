<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Ícones de interface do milenium archive. Uso: <svg viewBox="0 0 24 24"><use href="…/ui.svg#nome"/></svg>.
       A cor vem de `color` (currentColor); a espessura do traço vem do CSS (stroke-width no <svg> de fora).
       Ícone que estende outro reaproveita o símbolo base com <use> e só acrescenta o que falta. -->

  <!-- quadro com montanha: base de "trocar-wall" e "imagem". O preenchimento do quadro vem de fora
       (fill do <use>); sem nada definido, fica vazio. -->
  <symbol id="quadro" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2"/>
    <path d="M3 15l4.5-4.5 4 4L15 11l6 5.5" fill="none"/>
  </symbol>
  <symbol id="trocar-wall" viewBox="0 0 24 24">
    <use href="#quadro" fill="none"/>
  </symbol>
  <symbol id="imagem" viewBox="0 0 24 24">
    <use href="#quadro" fill="currentColor" fill-opacity=".16"/>
    <circle cx="8.5" cy="8.5" r="1.4" fill="none" stroke="currentColor"/>
  </symbol>

  <symbol id="pasta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5.5A1.5 1.5 0 015.5 4H10l2 2.5h6.5A1.5 1.5 0 0120 8v10.5a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 18.5z" fill="currentColor" fill-opacity=".16"/>
  </symbol>
  <symbol id="pasta-pessoa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <use href="#pasta"/>
    <circle cx="12" cy="12" r="2.2"/>
    <path d="M8.2 17.2c.5-1.8 2-2.8 3.8-2.8s3.3 1 3.8 2.8"/>
  </symbol>

  <symbol id="caixa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z" fill="currentColor" fill-opacity=".16"/>
    <path d="M4 7.5l8 4.5 8-4.5"/><path d="M12 12v9"/>
  </symbol>
  <symbol id="casa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 11l8-7 8 7v8.5a1.5 1.5 0 01-1.5 1.5H5.5A1.5 1.5 0 014 19.5z" fill="currentColor" fill-opacity=".16"/>
    <path d="M10 21v-6h4v6"/>
  </symbol>
  <symbol id="camadas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8l9-5 9 5-9 5z" fill="currentColor" fill-opacity=".16"/>
    <path d="M3 12l9 5 9-5"/><path d="M3 16l9 5 9-5"/>
  </symbol>
  <!-- bandeja: base de "exportar" (seta descendo nela) e "importar" (seta saindo dela) -->
  <symbol id="bandeja" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 15v3.5A1.5 1.5 0 005.5 20h13a1.5 1.5 0 001.5-1.5V15" fill="currentColor" fill-opacity=".16"/>
  </symbol>
  <symbol id="exportar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <use href="#bandeja"/>
    <path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/>
  </symbol>
  <symbol id="importar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <use href="#bandeja"/>
    <path d="M12 15V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/>
  </symbol>
  <symbol id="desligar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
    <path d="M12 3v9"/><path d="M18.4 6.6a9 9 0 11-12.8 0"/>
  </symbol>
  <symbol id="microscopio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(30 12 10)">
      <rect x="10" y="2.4" width="4" height="8.4" rx="2" fill="currentColor" fill-opacity=".16"/>
      <path d="M10 5.1h4"/>
    </g>
    <path d="M15.4 8.2c2.4 2.1 2.7 5.2 1.2 7.2"/>
    <path d="M8.4 13.9h4"/>
    <path d="M6.4 15.9h11.2"/>
    <path d="M5 20.7h14"/>
    <path d="M8.9 20.7c0-2.2 1.4-3.6 3.1-3.6s3.1 1.4 3.1 3.6"/>
  </symbol>
  <symbol id="engrenagem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3.2"/>
    <circle cx="12" cy="12" r="6.4"/>
    <path d="M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.4 5.4l2.1 2.1M16.5 16.5l2.1 2.1M18.6 5.4l-2.1 2.1M7.5 16.5l-2.1 2.1"/>
  </symbol>
  <symbol id="log" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h9l4 4v14H6z"/>
    <path d="M15 3v4h4"/>
    <path d="M9 11h7M9 14.5h7M9 18h4"/>
  </symbol>
  <!-- lupa (Loot Appraiser) -->
  <symbol id="lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6" fill="currentColor" fill-opacity=".16"/>
    <path d="M15 15l5.5 5.5"/>
  </symbol>
  <symbol id="buyback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 12a8 8 0 1 1-2.3-5.7"/>
    <path d="M20 4v3.3h-3.3"/>
    <circle cx="12" cy="12" r="3"/>
  </symbol>
</svg>
